name: Documentation and Agent Task Validation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/**"
      - "AGENTS.md"
      - "README.md"
      - "PANDUAN-MULAI-LOW-AGENT.md"
      - "README-SERVER.md"
      - ".github/workflows/docs-validate.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tools/**"
      - "AGENTS.md"
      - "PANDUAN-MULAI-LOW-AGENT.md"
      - ".github/workflows/docs-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation requirements
        run: python3 -m pip install -r tools/requirements-agent.txt
      - name: Validate script syntax
        run: python3 -m compileall -q tools
      - name: Validate task DAG and links
        run: python3 tools/validate_plan.py
      - name: Verify repository and documentation contracts
        run: python3 tools/check_repo_contracts.py
      - name: Smoke test agent tooling
        run: python3 tools/test_agent_tooling.py
      - name: Bootstrap agent tooling without shell activation
        run: python3 tools/bootstrap_agent.py
      - name: Confirm bootstrap is idempotent
        run: python3 tools/bootstrap_agent.py
